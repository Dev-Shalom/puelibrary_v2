<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login — Peaceland University Enugu</title>
<link href="favicon.ico" rel="shortcut icon"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: url('index_files/PeacelandBackgroundImage.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 35, 0.88);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255, 193, 7, 0.6);
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
        }

        .university-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .portal-title {
            color: #ffc107;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Login Form Card */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .login-card::before {
            content: '';
            display: block;
            height: 3px;
            background: rgba(255, 193, 7, 0.6);
            border-radius: 3px 3px 0 0;
            margin: -30px -30px 25px -30px;
            width: calc(100% + 60px);
        }

        /* Error Message */
        .error-message {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff6b6b;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Form Inputs */
        .form__input-group {
            margin-bottom: 18px;
        }

        .form__input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form__input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form__input:focus {
            border-color: rgba(255, 193, 7, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.1);
            background: rgba(15, 23, 42, 0.7);
        }

        /* Password Toggle Row */
        .password-toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .password-toggle-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffc107;
            cursor: pointer;
        }

        .passwordlabel {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }

        /* Submit Button */
        .form__button {
            width: 100%;
            padding: 14px;
            background: rgba(220, 53, 69, 0.85);
            color: #fff;
            border: 1px solid rgba(220, 53, 69, 0.5);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form__button:hover {
            background: rgba(220, 53, 69, 1);
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
            transform: translateY(-2px);
        }

        .form__button:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            margin-top: 25px;
        }

        .footer-brand {
            color: #ffc107;
            font-weight: 600;
        }

        /* Autofill fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: white;
            -webkit-box-shadow: 0 0 0px 1000px rgba(15, 23, 42, 0.7) inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .university-name {
                font-size: 1.3rem;
            }
            .login-card {
                padding: 20px;
            }
            .login-card::before {
                margin: -20px -20px 20px -20px;
                width: calc(100% + 40px);
            }
        }
    </style>
</head>
<body>
<div class="container">
<!-- Logo Section -->
<div class="logo-section">
<img alt="Peaceland University Enugu Logo" src="index_files/Peaceland%20Logo.jpg"/>
<div class="university-name">PEACELAND UNIVERSITY ENUGU</div>
<div class="portal-title">Electronic Library Portal</div>
</div>
<!-- Login Card -->
<div class="login-card">
<!-- Error Message -->
<div class="error-message" id="errorMessage" style="display:none;">Invalid username or password. Please try again.</div>
<!-- Login Form -->
<form action="" class="form" id="login" method="POST">
<div class="form__input-group">
<input autofocus="" class="form__input" id="loginUsername" name="username" placeholder="Username" required="" type="text"/>
</div>
<div class="form__input-group">
<input class="form__input" id="loginPassword" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="password-toggle-row">
<input id="login--password--checkbox" type="checkbox"/>
<label class="passwordlabel" for="login--password--checkbox">Show Password</label>
</div>
<button class="form__button" id="loginButton" type="submit">Continue</button>
</form>
</div>
</div>
<script>
        // Show/Hide Password Toggle
        const passwordCheckbox = document.getElementById('login--password--checkbox');
        const passwordInput = document.getElementById('loginPassword');

        passwordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });

        // Portal access — the password is the decryption key for portal.html.
        // The verifier below is that same password encrypting a known string,
        // so a wrong password fails here without the password ever being stored.
        const PORTAL_USERNAME = 'puelibrary';
        const VERIFIER_PLAINTEXT = 'peaceland-portal-unlock';
        const VERIFIER = 'Dr6Pam6c/7tkznGe4cnlbd8Ed1/VcybPW1skj7lBeVBOw9fT2S5RIb5YIsKRvnEP787rKiipaY5Ea9AFQStmR51yhw==';
        const KDF_ITERATIONS = 250000;

        const loginForm = document.getElementById('login');
        const usernameInput = document.getElementById('loginUsername');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        async function unlockKey(password, salt) {
            const baseKey = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: KDF_ITERATIONS, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        }

        async function checkPassword(password) {
            const raw = Uint8Array.from(atob(VERIFIER), c => c.charCodeAt(0));
            const key = await unlockKey(password, raw.slice(0, 16));
            const plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
            return new TextDecoder().decode(plain) === VERIFIER_PLAINTEXT;
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMessage.style.display = 'none';

            if (!window.crypto || !crypto.subtle) {
                showError('This portal requires a secure connection (https://). Please open the site over HTTPS.');
                return;
            }

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            loginButton.disabled = true;
            loginButton.textContent = 'Verifying…';

            let ok = false;
            try {
                ok = (username === PORTAL_USERNAME) && await checkPassword(password);
            } catch (err) {
                ok = false;
            }

            loginButton.disabled = false;
            loginButton.textContent = 'Continue';

            if (ok) {
                try { sessionStorage.setItem('pueLibraryPass', password); } catch (err) {}
                window.location.href = 'portal.html';
            } else {
                showError('Invalid username or password. Please try again.');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
    </script>
